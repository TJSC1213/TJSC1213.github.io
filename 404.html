<!doctype html>
<html lang="zh-CN" data-lang="zh" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-zh="页面没找到 · TJSC1213" data-en="Page not found · TJSC1213">页面没找到 · TJSC1213</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <!-- 在首次绘制前定好主题与语言，避免闪烁 -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          d.setAttribute('data-theme', t);
          var l = localStorage.getItem('lang');
          if (l === 'zh' || l === 'en') d.setAttribute('data-lang', l);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <a class="skip-link" href="#main" data-zh="跳到正文" data-en="Skip to content">跳到正文</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" data-zh-aria-label="TJSC1213 首页" data-en-aria-label="TJSC1213 home">
          <span class="brand-mark" aria-hidden="true">TJ</span>
          <span>TJSC1213</span>
        </a>

        <nav class="site-nav" id="site-nav" aria-label="主导航" data-zh-aria-label="主导航" data-en-aria-label="Main navigation">
          <a href="/" data-zh="首页" data-en="Home">首页</a>
          <a href="/blog/" data-zh="博客" data-en="Blog">博客</a>
          <a href="/projects/" data-zh="项目" data-en="Projects">项目</a>
          <a href="/about/" data-zh="关于" data-en="About">关于</a>
        </nav>

        <div class="header-actions">
          <button type="button" class="icon-btn" id="lang-toggle" aria-label="Switch to English">EN</button>

          <button type="button" class="icon-btn" id="theme-toggle" aria-label="切换到深色主题">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>

          <button
            type="button"
            class="icon-btn menu-btn"
            id="menu-toggle"
            aria-expanded="false"
            aria-controls="site-nav"
            aria-label="打开导航菜单"
            data-zh-aria-label="打开导航菜单"
            data-en-aria-label="Open navigation menu"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="site-main" id="main">
      <div class="container centered">
        <div class="page-header">
          <p class="muted" aria-hidden="true">404</p>
          <h1 class="page-title" data-zh="这个页面不存在" data-en="This page does not exist">这个页面不存在</h1>
          <p
            class="page-desc mx-auto"
            data-zh="链接可能写错了，或者这个页面已经被删掉。"
            data-en="The link may be wrong, or the page was removed."
          >
            链接可能写错了，或者这个页面已经被删掉。
          </p>
          <p>
            <a class="btn btn--primary" href="/" data-zh="回到首页" data-en="Go home">回到首页</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>
          © <span id="year">2026</span> TJSC1213 ·
          <span data-zh="用纯 HTML/CSS 手写而成" data-en="Hand-built with plain HTML &amp; CSS">用纯 HTML/CSS 手写而成</span>

        <div class="footer-links">
          <a href="https://github.com/TJSC1213" target="_blank" rel="noopener">GitHub</a>

          <a href="/about/" data-zh="关于" data-en="About">关于</a>
        </div>

    <script src="/assets/js/i18n.js" defer></script>
